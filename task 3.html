<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name ="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Demo</title>
  <style>
  /* Base Page Layout */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f3f4f6;
    display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
     /* Centered Login Card */
     main.card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #111827;
            text-align: center;
        }
        /* Demo Notice Subtext */
        .note {
            font-size: 13px;
            color: #6b7280;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.4;
        }
 /* Form Inputs & Labels */
        .form-group {
            margin-bottom: 18px;
        }
 label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
         input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        /* Action Button */
        button {
            width: 100%;
            padding: 11px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
         /* Dynamic Feedback Messages */
        #message {
            margin-top: 16px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
            display: none; /* Hidden until triggered */
            line-height: 1.4;
        }
         /* Message State Modifiers */
        #message.error {
            display: block;
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fee2e2;
        }
        #message.success {
            display: block;
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #dcfce7;
        }
        </style>
        </head>
        <main class="card">
        <h1>Log in</h1>
         <p class="note">Demo only. Use made-up details.<br>Try <strong>demo@example.com</strong> / <strong>demo1234</strong></p>
         <form id="login-form" novalidate>
          <div class="form-group">
           <label for="email">Email</label>
           <input id="email" type="email" autocomplete="off" placeholder="demo@example.com">
           </div>
           <div class="form-group">
           <label for="password">Password</label>
            <input id="password" type="password" autocomplete="off" placeholder="demo1234">
            </div>
             <button type="submit">Log in</button>
              </form>
           <!-- Status feedback display -->
          <p id="message" role="alert" aria-live="polite"></p>
          </main>
          <script>
           // Fictional workshop demo details
           const DEMO_EMAIL = "demo@example.com";
          const DEMO_PASSWORD = "demo1234";
         const form = document.getElementById("login-form");
         const msg = document.getElementById("message");
         // UI Helper to switch banner layouts 
        function show(text, type) {
        msg.textContent = text;
         msg.className = type; // Applies "error" or "success" class CSS rules
        }
        // Intercept form submission
            form.addEventListener("submit", (e) => {
             e.preventDefault();
             const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
         // 1. Check for blank fields
        if (!email || !password) {
         show("Enter your email and password.", "error");
            } 
         // 2. Validate against hardcoded test strings
           else if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
           show("Success! You are logged in (demo).", "success");
           } 
           // 3. Trigger fallback wrong state
           else {
           show("Email or password is incorrect. Try again.", "error");
           }
          });
          </script>
  </body> 
  </html>

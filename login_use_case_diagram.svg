<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#333333" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>

  <!-- System boundary -->
  <rect x="180" y="30" width="700" height="540" fill="#ffffff" stroke="#1f2937" stroke-width="2" rx="4"/>
  <text x="530" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">foosball.com</text>

  <!-- Actor -->
  <g stroke="#1f2937" stroke-width="2" fill="none">
    <circle cx="80" cy="260" r="16" fill="#ffffff"/>
    <line x1="80" y1="276" x2="80" y2="330"/>
    <line x1="50" y1="300" x2="110" y2="300"/>
    <line x1="80" y1="330" x2="55" y2="370"/>
    <line x1="80" y1="330" x2="105" y2="370"/>
  </g>
  <text x="80" y="392" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">User</text>

  <!-- Use case ellipses -->
  <!-- Log In (primary) -->
  <ellipse cx="300" cy="290" rx="90" ry="42" fill="#e4eee3" stroke="#2f5d3e" stroke-width="2"/>
  <text x="300" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Log In</text>
  <text x="300" y="304" text-anchor="middle" font-size="11" fill="#4a5a4e">(main use case)</text>

  <!-- Enter Username -->
  <ellipse cx="560" cy="110" rx="105" ry="38" fill="#f8ecd4" stroke="#d89a2e" stroke-width="2"/>
  <text x="560" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Enter Username</text>

  <!-- Enter Password -->
  <ellipse cx="560" cy="200" rx="105" ry="38" fill="#f8ecd4" stroke="#d89a2e" stroke-width="2"/>
  <text x="560" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Enter Password</text>

  <!-- Click Login -->
  <ellipse cx="560" cy="290" rx="105" ry="38" fill="#f8ecd4" stroke="#d89a2e" stroke-width="2"/>
  <text x="560" y="295" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Click Login</text>

  <!-- Validate Credentials -->
  <ellipse cx="790" cy="290" rx="70" ry="60" fill="#f7e4e0" stroke="#b8392f" stroke-width="2"/>
  <text x="790" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Validate</text>
  <text x="790" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Credentials</text>

  <!-- Show Error Message -->
  <ellipse cx="600" cy="460" rx="110" ry="45" fill="#f7e4e0" stroke="#b8392f" stroke-width="2"/>
  <text x="600" y="456" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Show Error</text>
  <text x="600" y="474" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Message</text>

  <!-- Actor -> Log In association -->
  <line x1="112" y1="290" x2="210" y2="290" stroke="#1f2937" stroke-width="2"/>

  <!-- Log In -> Enter Username (include) -->
  <line x1="374" y1="255" x2="460" y2="125" stroke="#4a5a4e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="410" y="175" text-anchor="middle" font-size="12" font-style="italic" fill="#4a5a4e" transform="rotate(-38 410 175)">&#171;include&#187;</text>

  <!-- Log In -> Enter Password (include) -->
  <line x1="388" y1="278" x2="456" y2="220" stroke="#4a5a4e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="420" y="238" text-anchor="middle" font-size="12" font-style="italic" fill="#4a5a4e" transform="rotate(-22 420 238)">&#171;include&#187;</text>

  <!-- Log In -> Click Login (include) -->
  <line x1="390" y1="290" x2="454" y2="290" stroke="#4a5a4e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="422" y="282" text-anchor="middle" font-size="12" font-style="italic" fill="#4a5a4e">&#171;include&#187;</text>

  <!-- Click Login -> Validate Credentials (include) -->
  <line x1="665" y1="290" x2="719" y2="290" stroke="#4a5a4e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="692" y="282" text-anchor="middle" font-size="12" font-style="italic" fill="#4a5a4e">&#171;include&#187;</text>

  <!-- Show Error Message -> Validate Credentials (extend) -->
  <line x1="655" y1="420" x2="750" y2="335" stroke="#4a5a4e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="735" y="390" text-anchor="middle" font-size="12" font-style="italic" fill="#4a5a4e" transform="rotate(-40 735 390)">&#171;extend&#187;</text>

  <!-- Legend -->
  <g font-size="12" fill="#4a5a4e">
    <line x1="200" y1="545" x2="230" y2="545" stroke="#1f2937" stroke-width="2"/>
    <text x="236" y="549">association</text>
    <line x1="330" y1="545" x2="360" y2="545" stroke="#4a5a4e" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <text x="366" y="549">&#171;include&#187; / &#171;extend&#187;</text>
  </g>
</svg>
